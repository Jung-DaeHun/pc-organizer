appId: com.jdh.pc-organizer
productName: PC 정리 도구
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

win:
  target:
    - nsis
  # 파일 이름은 ASCII 로 — productName 은 한글이라 그대로 두면 'PC 정리 도구 Setup 0.1.0.exe' 가 되고,
  # electron-builder 가 함께 내는 latest.yml 은 이미 이 ASCII 이름을 가리킨다(둘이 어긋난다).
  artifactName: pc-organizer-setup-${version}.${ext}
  # 조회 전용 도구라 관리자 권한이 필요 없다.
  # 권한을 올려 받으면 사용자가 경고를 무시하는 데 익숙해질 뿐이다.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
